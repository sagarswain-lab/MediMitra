version: api.keploy.io/v1beta1
kind: HTTP
name: prescription-read-test
spec:
  metadata:
    operation: POST
    url: /api/prescription/read
  request:
    header:
      Content-Type: application/json
    method: POST
    url: /api/prescription/read
    body: |
      {
        "image_base64": "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=",
        "language": "English"
      }
  response:
    status_code: 200
    header:
      Content-Type: application/json
    body: |
      {
        "medicines": [],
        "explanation": "The uploaded image does not appear to be a medical prescription. Please upload a clear photo of your prescription.",
        "translated_text": "No prescription details were processed."
      }
